# Applepie basic configuration v1 (UTF-8)
# 可选模板：复制到游戏目录 plugin/config/applepie.manager.ini。
# 不复制时由 Manager 自动创建；游戏内修改会自动保存。

# 界面语言：zh=中文，en=English
language=zh

# 隐藏选项：true=隐藏，false=显示
hide_uid=true
hide_ping=false
hide_menu_uid=true
hide_menu_name=true
hide_card_uid=true
hide_card_name=true

# 战斗 HUD：左下队伍、底部中间HP/SP、右下技能
hide_hud_left=false
hide_hud_center=false
hide_hud_right=false

# 插件启动偏好：plugin.<DLL 文件名>=true/false，文件名使用小写。
# 未列出的 DLL 默认启用；游戏内开关同时控制当前状态和启动偏好。
# plugin.example.dll=false
